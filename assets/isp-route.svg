<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="t d"><title id="t">链路：设备经入口和 ISP 到指定网站，普通流量从入口分流</title><desc id="d">链路：设备经入口和 ISP 到指定网站，普通流量从入口分流；彩色海报风格，提供选购、比较与验证入口。</desc><g font-family="Microsoft YaHei,PingFang SC,sans-serif"><rect width="1100" height="360" rx="18" fill="#16152b"/><text x="38" y="51" font-size="20" font-weight="700" fill="#ceff57">FOLLOW THE FLOW / 入口接入，ISP 落地</text><rect x="38" y="101" width="200" height="111" rx="13" fill="#ceff57"/><text x="138" y="151" text-anchor="middle" font-size="29" font-weight="900" fill="#16152b">你的设备</text><text x="138" y="187" text-anchor="middle" font-size="19" fill="#16152b">客户端接管</text><path d="M252 156h43m-12-9 12 9-12 9" fill="none" stroke="#ceff57" stroke-width="3"/><rect x="312" y="101" width="200" height="111" rx="13" fill="#ff91c1"/><text x="412" y="151" text-anchor="middle" font-size="29" font-weight="900" fill="#16152b">加密入口</text><text x="412" y="187" text-anchor="middle" font-size="19" fill="#16152b">先确认可连接</text><path d="M526 156h43m-12-9 12 9-12 9" fill="none" stroke="#ceff57" stroke-width="3"/><rect x="586" y="101" width="200" height="111" rx="13" fill="#83d9ff"/><text x="686" y="151" text-anchor="middle" font-size="29" font-weight="900" fill="#16152b">静态 ISP</text><text x="686" y="187" text-anchor="middle" font-size="19" fill="#16152b">固定出口</text><path d="M800 156h43m-12-9 12 9-12 9" fill="none" stroke="#ceff57" stroke-width="3"/><rect x="860" y="101" width="200" height="111" rx="13" fill="#c5a7ff"/><text x="960" y="151" text-anchor="middle" font-size="29" font-weight="900" fill="#16152b">指定网站</text><text x="960" y="187" text-anchor="middle" font-size="19" fill="#16152b">规则实际命中</text><path d="M412 212V290H561" fill="none" stroke="#ff91c1" stroke-width="3"/><text x="584" y="291" font-size="25" font-weight="700" fill="#ff91c1">普通网页与下载 → 走入口</text><text x="584" y="326" font-size="19" fill="#d6cee7">把 ISP 流量留给需要固定出口的网站。</text></g></svg>
