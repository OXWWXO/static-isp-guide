<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
<title id="title">设备、入口、ISP 与网站的连接顺序</title><desc id="desc">指定网站经入口和 ISP，普通网页从入口分流。</desc>
<g font-family="Microsoft YaHei,PingFang SC,sans-serif"><style>.paper{fill:#faf9f5}.ink{fill:#25251f}.muted{fill:#6e6b61}.line{stroke:#dedbd0}.accent{fill:#b86145}.soft{fill:#eeece2}
@media(prefers-color-scheme:dark){.paper{fill:#262624}.ink{fill:#f5f2e9}.muted{fill:#b7b3a8}.line{stroke:#48463f}.accent{fill:#e3a18a}.soft{fill:#34332e}}</style><rect width="1100" height="360" rx="16" class="paper"/>
<text x="40" y="49" font-size="14" letter-spacing="2" class="muted">A CLEARER ROUTE / 入口接入，ISP 落地</text>
<path d="M200 151H300M480 151H580M760 151H860" fill="none" stroke="#b86145" stroke-width="1.5"/>
<path d="m289 145 11 6-11 6m280-6 11 6-11 6m280-6 11 6-11 6" fill="none" stroke="#b86145" stroke-width="1.5"/>
<g class="soft"><rect x="40" y="104" width="160" height="101" rx="12"/><rect x="300" y="104" width="180" height="101" rx="12"/><rect x="580" y="104" width="180" height="101" rx="12"/><rect x="860" y="104" width="200" height="101" rx="12"/></g>
<g font-family="Noto Serif CJK SC,SimSun,serif" font-size="28" class="ink" text-anchor="middle"><text x="120" y="149">你的设备</text><text x="390" y="149">加密入口</text><text x="670" y="149">静态 ISP</text><text x="960" y="149">指定网站</text></g>
<g font-size="16" class="muted" text-anchor="middle"><text x="120" y="179">客户端接管</text><text x="390" y="179">先确认可以连接</text><text x="670" y="179">最后一跳固定出口</text><text x="960" y="179">确认规则实际命中</text></g>
<path d="M390 205V284H563" fill="none" stroke="#8b9272" stroke-width="1.5"/><circle cx="563" cy="284" r="3" fill="#8b9272"/>
<text x="586" y="283" font-size="22" class="ink">普通网页与下载，按原规则走入口。</text><text x="586" y="315" font-size="17" class="muted">把 ISP 流量留给需要固定出口的网站。</text></g></svg>
